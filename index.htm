<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gran Jugada: Desafío Bíblico en Cancha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-grid {
            display: grid;
            grid-template-columns: repeat(27, minmax(0, 1fr));
            grid-template-rows: repeat(17, minmax(0, 1fr));
            background-color: #166534;
        }
        .cell {
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .cell-dark { background-color: #15803d; }
        .cell-light { background-color: #166534; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col items-center p-3">
    <header class="text-center mb-2">
        <h1 class="text-2xl font-black text-emerald-400 tracking-wide">LA GRAN JUGADA</h1>
        <p class="text-xs text-slate-400 italic">Un Gran Desafío Bíblico en Cancha</p>
    </header>

    <!-- Pantalla de Configuración -->
    <div id="setup-screen" class="w-full max-w-xl bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 mt-4">
        <h2 class="text-xl font-bold text-white mb-4">Configuración del Partido</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Equipo 1 (Atacante Inicial / Ej. Judá):</label>
                <input type="text" id="team1-name" value="Judá" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Nombre Equipo 2 (Defensor Inicial / Ej. Israel):</label>
                <input type="text" id="team2-name" value="Israel" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Goles para ganar:</label>
                <input type="number" id="target-goals" value="3" min="1" max="10" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
            </div>
            <button onclick="startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg mt-2">
                ¡Iniciar La Gran Jugada!
            </button>
        </div>
    </div>

    <!-- Pantalla Principal de Juego (Diseño Responsivo: Izquierda PC / Abajo Móvil) -->
    <div id="game-screen" class="w-full max-w-7xl hidden flex flex-col items-center">
        <!-- Marcador superior con estadísticas de aciertos y errores -->
        <div class="w-full grid grid-cols-3 items-center bg-slate-800 px-4 py-3 rounded-xl mb-3 border border-slate-700 shadow-md">
            <div class="text-left">
                <span id="disp-team1" class="font-bold text-emerald-400 text-sm md:text-base">Judá</span>
                <span id="score-team1" class="text-xl font-black ml-2 bg-slate-900 px-2.5 py-0.5 rounded-lg">0</span>
                <div class="text-[10px] text-slate-400 mt-1">✓ <span id="t1-correct">0</span> | ✗ <span id="t1-errors">0</span></div>
            </div>
            <div class="text-center">
                <span class="text-[10px] uppercase tracking-widest text-slate-400 block">Turno Activo</span>
                <span id="disp-possession" class="font-bold text-amber-400 text-xs md:text-sm bg-slate-900 px-3 py-1 rounded-full border border-amber-500/30">Judá Atacando</span>
            </div>
            <div class="text-right">
                <span id="score-team2" class="text-xl font-black mr-2 bg-slate-900 px-2.5 py-0.5 rounded-lg">0</span>
                <span id="disp-team2" class="font-bold text-blue-400 text-sm md:text-base">Israel</span>
                <div class="text-[10px] text-slate-400 mt-1">✓ <span id="t2-correct">0</span> | ✗ <span id="t2-errors">0</span></div>
            </div>
        </div>

        <!-- Layout Táctico: Panel Izquierdo / Cancha Derecha -->
        <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
            
            <!-- Panel de Control y Tarjetas -->
            <div class="lg:col-span-4 flex flex-col gap-3 order-2 lg:order-1">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-between">
                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Centro de Mando Táctico</h3>
                        <p id="game-status-text" class="text-slate-200 text-xs mb-3">El equipo atacante tiene el control. Presiona para sacar tarjeta.</p>
                    </div>
                    <button id="draw-card-btn" onclick="drawCard()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl transition shadow-lg text-sm">
                        Sacar Tarjeta de Pregunta
                    </button>
                </div>

                <!-- Tarjeta Interactiva -->
                <div id="card-panel" class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col justify-between hidden">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span id="card-ref" class="text-[10px] font-bold bg-slate-900 px-2 py-0.5 rounded text-emerald-400">REF: A1</span>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-[10px] text-amber-400 font-bold">Tiempo:</span>
                                <span id="timer-display" class="text-xs font-black bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full border border-amber-500/40">20s</span>
                            </div>
                        </div>
                        <p id="card-question" class="text-sm font-semibold text-white mb-3">Pregunta aquí...</p>
                        
                        <!-- Opciones -->
                        <div id="options-container" class="grid grid-cols-1 gap-1.5 mb-3"></div>
                    </div>
                    <div id="card-result" class="text-xs font-bold text-center py-2 rounded-lg bg-slate-900 hidden"></div>
                </div>
            </div>

            <!-- Tablero Gráfico de 17x27 con Líneas Blancas -->
            <div class="lg:col-span-8 order-1 lg:order-2">
                <div class="relative w-full bg-emerald-700 border-4 border-white rounded-lg shadow-2xl overflow-hidden">
                    <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 270 170" preserveAspectRatio="none">
                        <line x1="135" y1="0" x2="135" y2="170" stroke="white" stroke-width="2" />
                        <circle cx="135" cy="85" r="25" stroke="white" stroke-width="2" fill="none" />
                        <circle cx="135" cy="85" r="2" fill="white" />
                        <rect x="0" y="42.5" width="35" height="85" stroke="white" stroke-width="2" fill="none" />
                        <rect x="0" y="65" width="12" height="40" stroke="white" stroke-width="2" fill="none" />
                        <rect x="-6" y="72.5" width="6" height="25" stroke="white" stroke-width="2" fill="none" />
                        <circle cx="22" cy="85" r="1.5" fill="white" />
                        <rect x="235" y="42.5" width="35" height="85" stroke="white" stroke-width="2" fill="none" />
                        <rect x="258" y="65" width="12" height="40" stroke="white" stroke-width="2" fill="none" />
                        <rect x="270" y="72.5" width="6" height="25" stroke="white" stroke-width="2" fill="none" />
                        <circle cx="248" cy="85" r="1.5" fill="white" />
                        <path d="M 0,10 A 10,10 0 0,0 10,0" stroke="white" stroke-width="1.5" fill="none" />
                        <path d="M 0,160 A 10,10 0 0,1 10,170" stroke="white" stroke-width="1.5" fill="none" />
                        <path d="M 270,10 A 10,10 0 0,1 260,0" stroke="white" stroke-width="1.5" fill="none" />
                        <path d="M 270,160 A 10,10 0 0,0 260,170" stroke="white" stroke-width="1.5" fill="none" />
                    </svg>
                    <div id="pitch-grid" class="pitch-grid w-full"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let gameState = {
            team1: "Judá",
            team2: "Israel",
            score1: 0,
            score2: 0,
            t1Correct: 0, t1Errors: 0,
            t2Correct: 0, t2Errors: 0,
            target: 3,
            attacker: 1, 
            ballX: 13, 
            ballY: 8,  
            timer: 20,
            interval: null,
            currentCard: null
        };

        const possibleDirections = [
            { code: "A", name: "Avanzar (Frente)", dx: 1, dy: 0 },
            { code: "ADD", name: "Avanzar Diagonal Derecha", dx: 1, dy: -1 },
            { code: "ADE", name: "Avanzar Diagonal Izquierda", dx: 1, dy: 1 },
            { code: "LD", name: "Lateral Derecho", dx: 0, dy: -1 },
            { code: "LE", name: "Lateral Izquierdo", dx: 0, dy: 1 },
            { code: "R", name: "Retroceder", dx: -1, dy: 0 },
            { code: "RDD", name: "Retroceder Diagonal Derecha", dx: -1, dy: -1 },
            { code: "RDE", name: "Retroceder Diagonal Izquierda", dx: -1, dy: 1 }
        ];

        // Banco expandido de preguntas base
        const sampleCards = [
            { ref: "A1", q: "Palavra chave no livro de Gênesis.", correct: "No princípio", options: ["No princípio", "Criação divina", "No princípio crió Deus", "A terra era sem forma"], refBib: "Gn 1:1" },
            { ref: "A1", q: "Bisavó de Noé. Não conheceu a morte.", correct: "Enoque", options: ["Matusalém", "Enoque", "Jared", "Lameque"], refBib: "Gn 5:21-29" },
            { ref: "A1", q: "Primeira promessa messiânica.", correct: "Gênesis 3:15", options: ["Gênesis 3:15", "Isaías 7:14", "Gênesis 12:3", "Salmo 22:1"], refBib: "Gn 3:15" },
            { ref: "A2", q: "Lugar onde Samuel orou por Israel e o julgou.", correct: "Mizpá", options: ["Betel", "Mizpá", "Ramá", "Silo"], refBib: "1 Sm 7:5,6" },
            { ref: "A2", q: "Começou a reinar em Jerusalém desde os 7 anos.", correct: "Joás", options: ["Josias", "Joás", "Uzias", "Salomão"], refBib: "2 Rs 11:21" },
            { ref: "A3", q: "Quantos anos viveu Adão?", correct: "Viveu 930 anos", options: ["Viveu 930 anos", "Viveu 969 anos", "Viveu 777 anos", "Viveu 500 anos"], refBib: "Gn 5:5" },
            { ref: "B1", q: "É conhecido como o Pai da Fé.", correct: "Abraão", options: ["Isaque", "Abraão", "Moisés", "Davi"], refBib: "Rm 4:16" },
            { ref: "B2", q: "Qual o Salmo mais curto?", correct: "Salmo 117", options: ["Salmo 117", "Salmo 133", "Salmo 23", "Salmo 150"], refBib: "Sl 117" }
        ];

        function startGame() {
            const t1 = document.getElementById('team1-name').value.trim();
            const t2 = document.getElementById('team2-name').value.trim();
            const target = parseInt(document.getElementById('target-goals').value);
            
            if(t1) gameState.team1 = t1;
            if(t2) gameState.team2 = t2;
            if(target) gameState.target = target;

            document.getElementById('disp-team1').innerText = gameState.team1;
            document.getElementById('disp-team2').innerText = gameState.team2;
            updateStatsUI();

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            renderPitch();
            updatePossessionLabel();
        }

        function updateStatsUI() {
            document.getElementById('score-team1').innerText = gameState.score1;
            document.getElementById('score-team2').innerText = gameState.score2;
            document.getElementById('t1-correct').innerText = gameState.t1Correct;
            document.getElementById('t1-errors').innerText = gameState.t1Errors;
            document.getElementById('t2-correct').innerText = gameState.t2Correct;
            document.getElementById('t2-errors').innerText = gameState.t2Errors;
        }

        function renderPitch() {
            const grid = document.getElementById('pitch-grid');
            grid.innerHTML = '';
            for (let r = 0; r < 17; r++) {
                for (let c = 0; c < 27; c++) {
                    const cell = document.createElement('div');
                    const isDark = (r + c) % 2 === 0;
                    cell.className = `cell ${isDark ? 'cell-dark' : 'cell-light'}`;
                    
                    // Renderizar balón y fichas tácticas simplificadas
                    if (c === gameState.ballX && r === gameState.ballY) {
                        const ball = document.createElement('div');
                        ball.className = 'w-4 h-4 bg-white rounded-full shadow-md border-2 border-slate-900 z-20 flex items-center justify-center text-[8px] font-black text-slate-900';
                        ball.innerText = '⚽';
                        cell.appendChild(ball);
                    } else if (c === 2 && r === 8) {
                        // Ficha Arquero Equipo 1
                        const p1 = document.createElement('div');
                        p1.className = 'w-3 h-3 bg-emerald-400 rounded-full border border-white z-10';
                        cell.appendChild(p1);
                    } else if (c === 24 && r === 8) {
                        // Ficha Arquero Equipo 2
                        const p2 = document.createElement('div');
                        p2.className = 'w-3 h-3 bg-blue-400 rounded-full border border-white z-10';
                        cell.appendChild(p2);
                    }
                    grid.appendChild(cell);
                }
            }
        }

        function updatePossessionLabel() {
            const lbl = document.getElementById('disp-possession');
            if (gameState.attacker === 1) {
                lbl.innerText = `${gameState.team1} Atacando ➔`;
                lbl.className = "font-bold text-emerald-400 text-xs md:text-sm bg-slate-900 px-3 py-1 rounded-full border border-emerald-500/30";
            } else {
                lbl.innerText = `⬅️ ${gameState.team2} Atacando`;
                lbl.className = "font-bold text-blue-400 text-xs md:text-sm bg-slate-900 px-3 py-1 rounded-full border border-blue-500/30";
            }
        }

        function drawCard() {
            document.getElementById('draw-card-btn').disabled = true;
            const cardPanel = document.getElementById('card-panel');
            cardPanel.classList.remove('hidden');
            document.getElementById('card-result').classList.add('hidden');

            const card = sampleCards[Math.floor(Math.random() * sampleCards.length)];
            const randomDir = possibleDirections[Math.floor(Math.random() * possibleDirections.length)];
            const randomMov = Math.floor(Math.random() * 5) + 1; 

            gameState.currentCard = {
                ...card,
                dirObj: randomDir,
                mov: randomMov
            };

            document.getElementById('card-ref').innerText = `REF: ${card.ref} | ${card.refBib} | Mov: ${randomDir.code} (${randomMov} cas)`;
            document.getElementById('card-question').innerText = card.q;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            
            const shuffledOptions = [...card.options].sort(() => Math.random() - 0.5);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-900 hover:bg-slate-700 text-slate-200 p-2 rounded-lg border border-slate-700 transition text-xs font-medium";
                btn.innerText = opt;
                btn.onclick = () => evaluateAnswer(opt === card.correct);
                optContainer.appendChild(btn);
            });

            gameState.timer = 20;
            document.getElementById('timer-display').innerText = `${gameState.timer}s`;
            
            if (gameState.interval) clearInterval(gameState.interval);
            gameState.interval = setInterval(() => {
                gameState.timer--;
                document.getElementById('timer-display').innerText = `${gameState.timer}s`;
                if (gameState.timer <= 0) {
                    clearInterval(gameState.interval);
                    evaluateAnswer(false);
                }
            }, 1000);
        }

        function evaluateAnswer(isCorrect) {
            clearInterval(gameState.interval);
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            const resultDiv = document.getElementById('card-result');
            resultDiv.classList.remove('hidden');

            const defenderName = gameState.attacker === 1 ? gameState.team2 : gameState.team1;
            const attackerName = gameState.attacker === 1 ? gameState.team1 : gameState.team2;
            const dir = gameState.currentCard.dirObj;
            const mov = gameState.currentCard.mov;

            // Registrar estadísticas de aciertos/errores
            if (gameState.attacker === 1) {
                if (isCorrect) gameState.t2Correct++; else gameState.t1Errors++;
            } else {
                if (isCorrect) gameState.t1Correct++; else gameState.t2Errors++;
            }
            updateStatsUI();

            if (isCorrect) {
                resultDiv.className = "text-xs font-bold text-center py-2 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                resultDiv.innerText = `¡Correcto! ${defenderName} interceptó. ¡Robo de posesión!`;
                gameState.attacker = gameState.attacker === 1 ? 2 : 1;
            } else {
                resultDiv.className = "text-xs font-bold text-center py-2 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40";
                resultDiv.innerText = `Incorrecto / Tiempo agotado. ${attackerName} avanza (${dir.code}: ${mov} casillas).`;
                
                let multiplier = (gameState.attacker === 1) ? 1 : -1;
                gameState.ballX = Math.max(0, Math.min(26, gameState.ballX + (dir.dx * mov * multiplier)));
                gameState.ballY = Math.max(0, Math.min(16, gameState.ballY + (dir.dy * mov)));

                if (gameState.attacker === 1 && gameState.ballX >= 26) {
                    gameState.score1++;
                    updateStatsUI();
                    alert(`¡GOOOOL de ${gameState.team1}! ⚽🎉`);
                    gameState.ballX = 13; gameState.ballY = 8;
                } else if (gameState.attacker === 2 && gameState.ballX <= 0) {
                    gameState.score2++;
                    updateStatsUI();
                    alert(`¡GOOOOL de ${gameState.team2}! ⚽🎉`);
                    gameState.ballX = 13; gameState.ballY = 8;
                }
                renderPitch();
            }

            updatePossessionLabel();

            setTimeout(() => {
                document.getElementById('card-panel').classList.add('hidden');
                document.getElementById('draw-card-btn').disabled = false;
            }, 3500);
        }
    </script>
</body>
</html>
